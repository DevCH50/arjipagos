name: arjipagos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.25+34

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  equatable: ^2.0.5
  rxdart: ^0.28.0
  http: ^1.6.0
  shared_preferences: ^2.4.0
  flutter_secure_storage: ^10.1.0
  get_it: ^9.2.0
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.4.1
  webview_flutter: ^4.13.1
  google_fonts: ^8.1.0

  # ============================================================================
  # NOTIFICACIONES PUSH
  # ============================================================================

  # Firebase Core (requerido por firebase_messaging)
  firebase_core: ^4.7.0

  # Firebase Cloud Messaging - notificaciones push
  firebase_messaging: ^16.2.0

  # Notificaciones locales (foreground notifications)
  flutter_local_notifications: ^22.0.1

  # Render de HTML enriquecido en NotificacionesPage
  flutter_widget_from_html_core: ^0.17.2

  # Badge para el contador de notificaciones no leídas
  badges: ^3.1.2
  share_plus: ^13.1.0
  path_provider: ^2.1.5

  # Abrir URLs en el navegador externo (Aviso de Privacidad, etc.)
  url_launcher: ^6.3.1

  # Leer versión y build number de la app en tiempo de ejecución
  package_info_plus: ^10.1.0
  # Abrir el PDF del ticket con el visor nativo del dispositivo.
  # En Android lanza un ACTION_VIEW (la hoja de share_plus es ACTION_SEND y no
  # garantiza que haya un lector); en iOS usa el preview de UIDocumentInteraction.
  open_filex: ^4.7.0
  # Convierte a HTML el cuerpo Markdown de los banners, para que lo pinte el
  # mismo flutter_widget_from_html_core que ya usa Notificaciones. Es Dart puro,
  # sin código nativo: no toca los builds de Android ni de iOS.
  markdown: ^7.3.1
  pdfx: ^2.11.0
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.6
  injectable_generator: ^3.0.2
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  webview_flutter_platform_interface: ^2.10.0

# Configuración del ícono de la app
flutter_launcher_icons:
  android: true
  ios: true

  # Imagen ya compuesta: la usan iOS y los Android anteriores al icono
  # adaptativo. Cuadrada y sin alfa, porque iOS no admite transparencia y
  # redondea las esquinas él mismo (superelipse, no rectángulo redondeado).
  # Apple no publica keylines: pide llenar el lienzo de 1024 y no redondear
  # nada uno mismo. La convención de las plantillas de icono es 10 % de margen
  # por lado. En iOS el lienzo ENTERO es el botón, sin recuadro visible más
  # pequeño como en Android, así que para que el emblema se vea del MISMO tamaño
  # en las dos plataformas hay que usar la misma proporción del botón: 57/72 =
  # 79.2 %. Y esa cifra deja 10.4 % de margen por lado, justo la convención de
  # Apple: igualar Android y cumplir la guía de iOS resultan ser lo mismo.
  image_path: "assets/disenio/iconos/icono_app_3d.png"

  # Icono adaptativo (Android 8+): son DOS capas que el lanzador compone y
  # recorta con su propia máscara —círculo, squircle, gota...—. De los 108 dp
  # del lienzo el lanzador solo deja ver los 72 centrales, y lo único
  # garantizado es un círculo de 66 dp. Ese 66 dp es además la keyline de
  # círculo de los product icons de Material (176/192 dp), así que para un
  # emblema circular como el de ARJI es LA medida máxima, no un tanteo. Aquí se
  # usa 57 dp (79.2 % del botón), que es la keyline de CUADRADO de Material
  # (152/192 dp): a 66 dp el emblema queda pegado al borde de la máscara.
  #
  # OJO: flutter_launcher_icons envuelve la capa de frente en un
  # <inset android:inset="16%"> al escribir mipmap-anydpi-v26/ic_launcher.xml,
  # que la encoge al 68 %. Por eso el emblema va al 77.6 % dentro de su PNG:
  # 77.6 % x 0.68 x 108 dp = 57 dp. Ese XML se regenera en cada ejecución, así
  # que la compensación tiene que vivir en el PNG, no en el XML.
  adaptive_icon_background: "assets/disenio/iconos/icono_fondo_3d.png"
  adaptive_icon_foreground: "assets/disenio/iconos/icono_frente_3d.png"

  # Iconos temáticos de Android 13+: si el usuario los activa, el sistema pinta
  # esta silueta con los colores de su fondo de pantalla. Sin ella, Android
  # improvisa una a partir del icono y suele quedar mal.
  adaptive_icon_monochrome: "assets/disenio/iconos/icono_mono_3d.png"

  remove_alpha_ios: true

# Configuración del Splash Screen nativo
flutter_native_splash:
  # Fondo marrón (para áreas que no cubra la imagen)
  color: "#795548"
  color_dark: "#5D4037"

  # Imagen fullscreen con fondo marrón y círculo blanco
  fullscreen: true
  image: assets/disenio/splash/splash_logo.png

  # Android 12+ (usa icono adaptativo con círculo)
  android_12:
    color: "#795548"
    color_dark: "#5D4037"
    image: assets/arji/logo_arji.png
    icon_background_color: "#FFFFFF"

  # Configuración general
  android: true
  ios: true
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # Se declaran ARCHIVO POR ARCHIVO, no la carpeta. Declarar la carpeta empaqueta
  # todo lo que haya dentro —incluido lo que git ignora—, y así se habían colado
  # 34 MB de insumos de diseño y respaldos en la app. Los fuentes de icono y
  # splash viven ahora en `assets/disenio/`, que NO se empaqueta: al declararse
  # archivo por archivo, estar dentro de assets/ no basta para entrar al bundle.
  assets:
    - assets/img/background_shopping.jpg
    - assets/arji/logo_arji.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
